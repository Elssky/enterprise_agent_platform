name: optimized-pages

# Optimized documentation deployment. Single source for the optimized GitHub Pages site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: optimized-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Prepare optimized documentation source
        run: |
          rm -rf .optimized-docs
          mkdir -p .optimized-docs/part01-overview/ch
          mkdir -p .optimized-docs/part02-model-inference/ch
          mkdir -p .optimized-docs/images/part1/ch
          mkdir -p .optimized-docs/images/part2/ch
          mkdir -p .optimized-docs/stylesheets

          cp docs/optimized_index.md .optimized-docs/index.md

          cp docs/part01-overview/ch/new_index_.md .optimized-docs/part01-overview/ch/new_index_.md
          cp docs/part01-overview/ch/new_ch01-agent_.md .optimized-docs/part01-overview/ch/new_ch01-agent_.md
          cp docs/part01-overview/ch/new_ch02-agent_.md .optimized-docs/part01-overview/ch/new_ch02-agent_.md
          cp docs/part01-overview/ch/new_ch03-ai-agent_.md .optimized-docs/part01-overview/ch/new_ch03-ai-agent_.md
          cp docs/part01-overview/ch/new_ch04_.md .optimized-docs/part01-overview/ch/new_ch04_.md

          cp docs/part02-model-inference/ch/new_index_.md .optimized-docs/part02-model-inference/ch/new_index_.md
          cp docs/part02-model-inference/ch/new_ch05_.md .optimized-docs/part02-model-inference/ch/new_ch05_.md
          cp docs/part02-model-inference/ch/new_ch06_.md .optimized-docs/part02-model-inference/ch/new_ch06_.md
          cp docs/part02-model-inference/ch/new_ch07_.md .optimized-docs/part02-model-inference/ch/new_ch07_.md
          cp docs/part02-model-inference/ch/new_ch08_.md .optimized-docs/part02-model-inference/ch/new_ch08_.md
          cp docs/part02-model-inference/ch/new_ch09_.md .optimized-docs/part02-model-inference/ch/new_ch09_.md

          cp -r docs/images/part1/ch/. .optimized-docs/images/part1/ch/
          cp -r docs/images/part2/ch/. .optimized-docs/images/part2/ch/
          cp -r docs/stylesheets/. .optimized-docs/stylesheets/

      - name: Build optimized Chinese site
        run: mkdocs build --strict --clean --config-file mkdocs.optimized.yml --site-dir site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
