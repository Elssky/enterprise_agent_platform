name: optimized-pages

# Optimized documentation deployment. Single source for the optimized GitHub Pages site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: optimized-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Prepare optimized documentation source
        run: |
          rm -rf .optimized-docs
          mkdir -p .optimized-docs/stylesheets
          cp docs/optimized_index.md .optimized-docs/index.md

          # Publish only optimized Markdown drafts. Original and not-yet-optimized
          # chapters stay in the repository but never enter the Pages source tree.
          for dir in docs/part*/ch; do
            [ -d "$dir" ] || continue
            if find "$dir" -maxdepth 1 -type f -name 'new_*.md' | grep -q .; then
              target=".optimized-docs/${dir#docs/}"
              mkdir -p "$target"
              find "$dir" -maxdepth 1 -type f -name 'new_*.md' -exec cp {} "$target/" \;
            fi
          done

          # Images are static dependencies of optimized chapters. No original
          # Markdown pages are copied into the optimized site.
          mkdir -p .optimized-docs/images
          for imgdir in docs/images/part*; do
            [ -d "$imgdir" ] || continue
            target=".optimized-docs/images/${imgdir#docs/images/}"
            mkdir -p "$target"
            cp -r "$imgdir"/. "$target"/
          done

          cp -r docs/stylesheets/. .optimized-docs/stylesheets/

      - name: Build optimized Chinese site
        run: mkdocs build --strict --clean --config-file mkdocs.optimized.yml --site-dir site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
